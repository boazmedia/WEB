<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BOAZ Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0a1a4f;--navy2:#08133a;--orange:#f7941d;--bg:#f4f6fb;--line:#e6e9f2;--text:#1e2a3a;--muted:#5d6b80;--green:#15873f;--cond:'Roboto Condensed','Arial Narrow',Arial,sans-serif;--body:'Open Sans',Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--body);font-size:14px;background:var(--bg);color:var(--text)}
button{font-family:inherit}
.ic{width:20px;height:20px;flex:none}

/* Sidebar */
.sidebar{position:fixed;inset:0 auto 0 0;width:270px;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;overflow-y:auto;z-index:30;transition:transform .2s}
.logo{height:70px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.12);font-size:24px;font-weight:700;letter-spacing:.2px}
.logo span{color:var(--orange)}
.menu{padding:14px 0}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 24px;background:none;border:0;color:#fff;font-size:15.5px;text-align:left;cursor:pointer;font-weight:500}
.mi .ic{color:var(--orange)}
.mi .lbl{flex:1}
.mi .chev{width:16px;height:16px;color:#cbd3ee;transition:transform .15s}
.mi:hover,.mi.active{background:rgba(255,255,255,.08)}
.group.open>.mi .chev{transform:rotate(90deg)}
.sub{display:none;background:rgba(0,0,0,.18)}
.group.open>.sub{display:block}
.si{display:flex;align-items:center;gap:14px;width:100%;padding:11px 24px 11px 30px;background:none;border:0;color:#e4e9f8;text-align:left;font-size:15px;cursor:pointer}
.si:before{content:"";width:18px;height:18px;border:2px solid var(--orange);border-radius:50%;flex:none}
.si:hover,.si.active{color:#fff;background:rgba(255,255,255,.07)}
.sec{padding:16px 24px 6px;font-size:13px;color:#8b97c4;letter-spacing:.5px}

/* Top bar */
.top{position:fixed;left:270px;right:0;top:0;height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:8px;z-index:20;transition:left .2s}
.top .tl{display:flex;align-items:center;gap:26px;flex:1}
.tbtn{background:none;border:0;color:#3a475c;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px}
.tbtn:hover{background:#f1f3f9}
.tbtn .ic{width:18px;height:18px}
.dd{position:relative}
.dd-menu{position:absolute;right:0;top:100%;margin-top:6px;min-width:240px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,60,.15);padding:6px;display:none;z-index:40}
.dd.open .dd-menu{display:block}
.dd-menu .it{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--text)}
.dd-menu .it:hover{background:#f1f3f9}
.dd-menu .it.cur{font-weight:700;color:#2c4bd6}
.dd-menu .hd{padding:8px 12px;font-size:11px;color:var(--muted);font-family:var(--cond);letter-spacing:.6px;text-transform:uppercase}
.dd-menu .note{padding:8px 12px;font-size:13px;color:var(--muted)}
.badge-dot{background:#e5484d;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;margin-left:-6px;margin-top:-14px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f7941d,#c2410c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.uname{font-size:16px;letter-spacing:.3px;text-transform:uppercase}

/* Content */
main{margin-left:270px;padding:88px 24px 30px;transition:margin .2s}
body.collapsed .sidebar{transform:translateX(-270px)}body.collapsed .top{left:0}body.collapsed main{margin-left:0}
h1{font-family:var(--cond);font-size:28px;margin:0 0 4px;font-weight:700}
.psub{color:var(--muted);margin:0 0 20px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.phead .psub{margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(20,30,60,.05)}
.row-top{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
.biz{position:relative;overflow:hidden;min-height:300px}
.eyebrow{font-family:var(--cond);font-size:16px;text-transform:uppercase;letter-spacing:.2px}
.biz h2{font-family:var(--cond);font-size:34px;margin:6px 0 10px;font-weight:700;text-transform:uppercase}
.biz .meta{color:var(--muted);display:flex;align-items:center;gap:8px;margin:8px 0;font-size:15px}
.biz .meta .ic{width:16px;height:16px}
.biz .right{position:absolute;right:24px;top:24px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;background:#15873f;color:#fff;font-family:var(--cond);font-weight:700;font-size:18px;padding:8px 18px;border-radius:6px}
.pill:before{content:"";width:9px;height:9px;border-radius:50%;background:#fff}
.since{margin-top:14px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:flex-end}
.watermark{position:absolute;right:10px;bottom:-10px;width:170px;height:170px;color:#eef1f7}
.qa .eyebrow{margin-bottom:14px}
.bx{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1px solid #9aa3b5;background:#fff;border-radius:6px;font-size:16px;color:#3a475c;cursor:pointer;margin-bottom:8px}
.bx:hover{background:#f4f6fb}
.bx.dark{background:#6b7075;color:#fff;border-color:#6b7075;cursor:not-allowed}
.qa p{margin:6px 0 14px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.m{position:relative;padding:20px}
.m .lb{font-family:var(--cond);font-size:14px;text-transform:uppercase;color:#333}
.m .v{font-family:var(--cond);font-size:26px;font-weight:700;margin:16px 0 10px}
.m .ds{color:var(--muted);font-size:15px;margin-bottom:8px}
.m .tr{color:var(--muted);font-size:15px}
.m .tr b{font-weight:500}
.tr.up{color:#15873f}.tr.down{color:#c0262d}
.mi-ic{position:absolute;right:20px;top:20px;width:50px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.mi-ic .ic{width:24px;height:24px}
.c-green{background:#dcf3e5;color:#2f9e5f}.c-orange{background:#ffeadb;color:#f26b00}.c-teal{background:#d8f2f3;color:#17a2b8}
.c-purple{background:#f1e2f8;color:#9b3fc7}.c-blue{background:#dbe8fb;color:#2c6fd6}.c-yellow{background:#fff3d3;color:#f5a300}.c-violet{background:#ece6fb;color:#6f42c1}

/* Subscription */
.subh{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.subh h2{font-family:var(--cond);font-size:26px;font-weight:400;margin:0 0 10px}
.subh .l{color:var(--muted);font-size:14px;margin:6px 0}
.subh .r{text-align:right}
.bd{display:inline-block;font-family:var(--cond);font-weight:700;font-size:16px;padding:5px 12px;border-radius:5px;margin-left:6px}
.bd.green{background:#15873f;color:#fff}.bd.yellow{background:#ffc107;color:#1e2a3a}.bd.cyan{background:#0dcaf0;color:#0a1a4f;font-size:12px;margin:8px 0 10px 0}.bd.red{background:#c0262d;color:#fff}
.hr{border:0;border-top:1px solid var(--line);margin:22px 0 4px}
.kv2{display:flex;max-width:400px;justify-content:space-between;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv2:last-child{border:0;font-weight:700;font-size:16px}.kv2 .blue{color:#1a5fe0}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px}
.card.pl{padding:0;overflow:hidden}
.card.pl>h3{font-family:var(--cond);font-size:18px;margin:0;padding:18px 16px;border-bottom:1px solid var(--line)}
.us{padding:14px 16px 0}.us:last-child{padding-bottom:16px}
.ur{display:flex;justify-content:space-between;color:#4b596e;font-size:14px;margin-bottom:8px}
.ur span:last-child{color:#1e2a3a;font-family:var(--cond);font-weight:500}
.bar0{height:6px;background:#e9edf4;border-radius:3px;overflow:hidden}
.bar0 .ok{height:100%;background:#28a05a}.bar0 .full{height:100%;background:#dc3545}
.mods{display:flex;flex-wrap:wrap;gap:10px;padding:16px}
.mod{background:#0d6efd;color:#fff;font-family:var(--cond);font-weight:700;font-size:17px;padding:8px 14px;border-radius:5px}
.mod small{font-weight:400;opacity:.8;font-size:14px}
.acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.ab{display:inline-flex;align-items:center;gap:8px;border:1px solid #0d6efd;color:#0d6efd;background:#fff;padding:9px 14px;border-radius:5px;font-size:15px;cursor:pointer}
.ab.solid{background:#0d6efd;color:#fff}.ab .ic{width:17px;height:17px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mcard{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mcard b{font-family:var(--cond);font-size:18px}
@media(max-width:1100px){.two,.mgrid{grid-template-columns:1fr}.subh .r{text-align:left}}

/* Dashboard charts */
.row3{display:grid;grid-template-columns:1.35fr 1fr .8fr;gap:20px;margin-top:20px}
.row4{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-top:20px}
.ch h3{font-family:var(--cond);font-size:21px;margin:0}
.chh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.chl{display:flex;align-items:center;gap:12px}
.chr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.chip{display:inline-block;background:#f1f3f9;color:#4b596e;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px}
.sel{padding:9px 12px;border:1px solid #cfd6e6;border-radius:6px;font-size:14px;background:#fff;min-width:180px;font-family:inherit;color:var(--text)}
.chico{width:50px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center}
svg.chart{width:100%;height:auto;display:block}
.gl{stroke:#dfe4ee;stroke-dasharray:4 4}.ax{font-size:12px;fill:#4b596e;font-family:var(--body)}
.ln{fill:none;stroke:#2c6fd6;stroke-width:2.5;stroke-linejoin:round}.dt{fill:#fff;stroke:#2c6fd6;stroke-width:2}
.bar{fill:#2c6fd6}
.donut{width:210px;height:210px;display:block;margin:12px auto 28px}.dl{font-size:20px;fill:#1e2a3a;font-family:var(--cond)}.dv{font-size:28px;fill:#1e2a3a;font-family:var(--cond)}
.lg{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}.lg i{width:12px;height:12px;border-radius:50%;flex:none}
.lg .pc{background:#f1f3f9;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;font-family:var(--cond)}
.lg .am{margin-left:auto;font-family:var(--cond);font-weight:700}
.dot-paid{background:#2c6fd6}.dot-pending{background:#f5a300}.dot-overdue{background:#e5484d}
.lgt{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;justify-content:space-between;font-family:var(--cond);font-weight:700;font-size:17px}
.lgt span:last-child{color:#2c6fd6}
.card.flush{padding:0;overflow:hidden}
.card.flush .chh{padding:22px 24px 14px;margin:0;align-items:center}
.card.flush table{border-radius:0}
.card.flush thead th{background:#f5f6fa;font-size:15px;color:#1e2a3a;text-transform:none;font-weight:700;font-family:var(--cond)}
.tp{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.tp .r{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.tp svg{display:block;width:100%;height:8px;margin-top:6px;border-radius:4px}
.tp .n{font-weight:600}.tp .u{color:var(--muted);white-space:nowrap}
.emptyc{text-align:center;color:var(--muted);padding:60px 0;font-size:16px}
@media(max-width:1100px){.row3,.row4{grid-template-columns:1fr}}

/* Product management */
.ptabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.ptab{display:flex;align-items:center;gap:8px;padding:11px 18px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0}
.ptab:hover{background:#eceff7}.ptab.on{background:var(--navy);color:#fff}.ptab .ic{width:16px;height:16px}
.ptool{display:flex;align-items:center;gap:14px;padding:16px 20px;flex-wrap:wrap}
.ptool h3{font-family:var(--cond);font-size:24px;font-weight:400;margin:0;min-width:140px}
.ptool .sel{flex:1;min-width:180px}
.btn.navy{background:var(--navy)}.btn.navy:hover{background:var(--navy2)}
.ptw{overflow:auto;padding:0 20px 16px}
.ptw table{border:1px solid var(--line)}
.ptw th{text-transform:none;font-size:14px;color:#1e2a3a;font-weight:700;padding:10px 12px}.ptw td{padding:10px 12px;white-space:nowrap}
.pfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:12px 20px;background:#f5f6fa;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.pfoot .sel{min-width:0;padding:6px 10px}
.upgrid,.setgrid{display:grid;gap:20px;margin-top:20px}.upgrid{grid-template-columns:1.6fr 1fr}.setgrid{grid-template-columns:repeat(3,1fr)}
.step{display:flex;gap:14px;margin-bottom:14px}.step i{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;flex:none}
.step b{display:block}.step small{color:var(--muted)}
.drop{border:1.5px dashed #d9cdb8;background:#fff8ef;border-radius:8px;text-align:center;padding:44px 20px;cursor:pointer;margin:18px 0 14px}
.drop.over{background:#ffefd6;border-color:var(--orange)}
.drop .ubox{width:40px;height:40px;background:var(--navy);color:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.drop small{display:block;color:var(--muted);margin-top:6px}
.upbar{display:flex;gap:8px}.upbtn{flex:1;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:11px;font-size:15px;font-weight:600;cursor:pointer}
.upbtn:disabled{background:#5b6478;cursor:not-allowed}
.tcol{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.tcol:last-child{border:0}
.tcol code{color:#d63384;font-size:13px}.tcol small{display:block;color:var(--muted);margin-top:4px}
.req,.opt{align-self:flex-start;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:#198754}.opt{background:#6c757d}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chipx{display:inline-flex;align-items:center;gap:6px;background:#f1f3f9;border-radius:6px;padding:5px 6px 5px 10px;font-size:13px}
.chipx small{color:var(--muted)}.chipx button{border:0;background:none;cursor:pointer;color:#8b97b0;font-size:16px;line-height:1}.chipx button:hover{color:#c0262d}
.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow .sel{flex:1;min-width:120px}
.upres li{margin:4px 0;font-size:13px}
.dialog.wide{width:min(640px,94vw)}.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:1100px){.upgrid,.setgrid{grid-template-columns:1fr}}
@media(max-width:600px){.fg{grid-template-columns:1fr}}

/* Expenses */
.xf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;padding:20px}
.xsec{padding:16px 20px;border-top:1px solid var(--line)}.xsec h3{font-family:var(--cond);font-size:20px;font-weight:400;margin:0}
.xgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px}
.xk{border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-height:104px}.xk small{font-size:11px;text-transform:uppercase;color:var(--muted)}
.xk b{display:block;font-family:var(--cond);font-size:22px;margin:6px 0}.xk .tr{font-size:12px}
.xpan{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-top:14px}.xpan>div{border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.btn.red{background:#dc3545}.btn.red:hover{background:#bb2d3b}
.field textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #cfd6e6;border-radius:6px;font:inherit;min-height:90px;resize:vertical}
.amt{display:flex;margin-top:6px}.amt b{display:flex;align-items:center;padding:0 10px;border:1px solid #cfd6e6;border-right:0;border-radius:6px 0 0 6px;background:#f5f6fa;font-weight:400}
.field .amt input{margin:0;border-radius:0 6px 6px 0}.field small{font-weight:400}
@media(max-width:1200px){.xgrid{grid-template-columns:repeat(3,1fr)}.xpan{grid-template-columns:1fr}}
@media(max-width:600px){.xgrid{grid-template-columns:1fr 1fr}}

/* Tables & forms */
.tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--cond);font-size:13px;text-transform:uppercase;text-align:left;color:#66748a;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.4px}
td{padding:13px 16px;border-bottom:1px solid #f0f2f8;font-size:14px}
tr:last-child td{border-bottom:0}
td.empty{text-align:center;color:var(--muted);padding:34px}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#e2f6ea;color:#15873f}
.tag.warn{background:#fff1d6;color:#a86500}.tag.bad{background:#fde6e7;color:#c0262d}
.btn{border:0;background:#2c4bd6;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:#2440b8}
.btn.ghost{background:#fff;color:#2c4bd6;border:1px solid #c5cdf0}
.btn.ghost:hover{background:#f1f3fd}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.full{width:100%;padding:13px;font-size:15px}
.rowb{display:flex;gap:6px}
.field{display:block;margin:12px 0;font-size:13px;color:#4b596e;font-weight:600}
.field input,.field select{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #cfd6e6;border-radius:6px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus{outline:2px solid #c5cdf0;border-color:#2c4bd6}
.msg{color:#c0262d;font-size:13px;min-height:18px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.prod{border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:#fff}
.prod:hover{border-color:#2c4bd6}.prod.out{opacity:.45;cursor:not-allowed}
.prod .em{font-size:30px;background:#f1f3fd;border-radius:8px;text-align:center;padding:12px;margin-bottom:8px}
.prod b{display:block}.prod small{color:var(--muted)}.prod .pr{color:#2c4bd6;font-weight:700;margin-top:4px}
.cl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f2f8}
.qty button{border:1px solid #cfd6e6;background:#fff;width:24px;height:24px;border-radius:6px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-family:var(--cond);font-size:22px;font-weight:700;margin:16px 0}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f2f8}
.kv.b{font-weight:700;font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(10,26,79,.55);display:flex;align-items:center;justify-content:center;z-index:60}
.dialog{background:#fff;border-radius:12px;padding:26px;width:min(430px,92vw);max-height:90vh;overflow:auto}
.dialog h2{font-family:var(--cond);margin:0 0 6px;font-size:22px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;bottom:24px;right:24px;background:#1e2a3a;color:#fff;padding:12px 18px;border-radius:8px;z-index:99}
.scrim{display:none}

 const res={created:0,skipped:[],errors:[]},seen=new Set(db.products.map(p=>p.name.toLowerCase())),skus=new Set(db.products.map(p=>p.sku.toLowerCase()));
 rows.forEach((o,i)=>{
  const r={};for(const k in o)r[k.trim().toLowerCase()]=String(o[k]).trim();const n="Row "+(i+2);

  if(r.sku&&skus.has(r.sku.toLowerCase()))return res.errors.push(`${n}: SKU ${r.sku} is already used`);

  if(db.products.length>=db.sub.limits.products)return res.errors.push(`${n}: product limit reached for your plan`);
  const category=addCat(r.product_category),sub=r.product_subcategory?addSub(r.product_subcategory,category):"";
  db.products.push(newProduct({name:r.name,sku:r.sku,category,sub,desc:r.description,low:Math.floor(low),unit:addUnit(r.unit_measure),priceType:pt}));
  seen.add(r.name.toLowerCase());if(r.sku)skus.add(r.sku.toLowerCase());res.created++;
 });
 upRes=res;pFile=null;save();render();toast(`${res.created} product(s) uploaded`);
}

function doReturn(s){
 const its=[];let bad=false;
 document.querySelectorAll("[data-rq]").forEach(inp=>{const i=s.items[+inp.dataset.rq],q=Math.floor(+inp.value)||0;if(q<=0)return;if(q>i.qty-(i.ret||0))bad=true;its.push([i,q])});
 if(bad)return $("retMsg").textContent="Return quantity is more than what is left on the sale.";
 if(!its.length)return $("retMsg").textContent="Enter a return quantity for at least one item.";
 keepOrig(s);let amt=0;const rows=[];
 for(const [i,q] of its){const v=Math.round((i.vat||0)*q/i.qty),a=i.price*q+v,p=prodOf(i);
  amt+=a;s.total-=a;s.vat=(s.vat||0)-v;s.cost-=(i.cost??p?.cost??0)*q;i.ret=(i.ret||0)+q;if(p)p.stock+=q;rows.push({name:i.name,qty:q,amount:a})}
 const no="SR-"+pad(db.retSeq++);
 s.returns.push(no);db.returns.unshift({no,sale:s.no,customer:s.customer,date:today(),amount:amt,reason:$("retWhy").value.trim(),items:rows});
 if(s.items.every(i=>(i.ret||0)>=i.qty)){s.status="Returned";s.total=0;s.cost=0}
 save();render();toast(`Return ${no} recorded`);openSale(s.no,"action");
}
function printDoc(title,html,css,page){
 const f=document.createElement("iframe");f.style.cssText="position:fixed;left:-9999px;top:0;width:800px;height:1000px;border:0";document.body.appendChild(f);
 f.contentDocument.write(`<!doctype html><title>${esc(title)}</title><style>${page||""}body{font:13px Arial,sans-serif;max-width:340px;margin:16px auto;color:#111}h2,h3{text-align:center;margin:4px 0}table{width:100%;border-collapse:collapse;margin:10px 0}td,th{padding:4px 2px;text-align:left;border-bottom:1px dashed #aaa}.r{text-align:right}.c{text-align:center}p{margin:3px 0}${css||""}</style>${html}`);
 f.contentDocument.close();f.contentWindow.focus();setTimeout(()=>f.contentWindow.print(),150);setTimeout(()=>f.remove(),4000);
}

const rcRow=(a,b,c)=>`<div class="row${c||""}"><span>${a}</span><span>${b}</span></div>`;
const rcHtml=s=>{
 const b=db.biz,d=new Date(s.at),p2=n=>String(n).padStart(2,"0"),
  date=`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`,time=`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`,
  total=sTotal(s),paid=payState(s)==="Paid",tend=paid?total:0,sub=total-(s.vat||0),
  items=s.items.map(i=>`<div class="it"><span>${esc(i.name)}</span><span class="q">${i.qty}</span><span class="t">${rcN(itemTotal(i))}</span></div><div class="sub">@ ${rcN(i.price)}</div>`).join("");
 const html=`<body class="rc"><img class="logo" src="${RCT_LOGO}" alt="">
 <div class="ttl big">${esc(b.name)}</div><div class="ttl big">RECEIPT</div><hr class="hr">
 <div class="sec">BUSINESS DETAILS</div>
 <div>Business Name: ${esc(b.name)}</div><div>TIN / VRN: ${esc(b.tin||"-")} / -</div><div>Location: ${esc(b.location||"-")}</div><div>Contact: ${esc(b.email||"-")}</div><hr class="hr">
 ${rcRow("Receipt No.","RCT-"+esc(s.no))}${rcRow("Date",date)}${rcRow("Time",time)}${rcRow("Served By",esc((s.user||"").toUpperCase()))}${rcRow("Invoice Ref.",esc(s.invoice||"-"))}<hr class="hr">
 <div class="sec">ITEMS SOLD</div>
 <div class="th"><span>Item / Service</span><span class="q">Qty</span><span class="t">Total</span></div>${items}<hr class="hr">
 ${rcRow("Subtotal",rcN(sub))}${s.vat?rcRow("VAT",rcN(s.vat)):""}<hr class="hr">
 ${rcRow("TOTAL","TZS "+rcN(total)," tot")}${rcRow("Amount Tendered",rcN(tend))}${rcRow("CHANGE","TZS 0"," b")}${paid?"":rcRow("BALANCE DUE","TZS "+rcN(total)," b")}<hr class="hr">
 <div class="sec">PAYMENT</div>${rcRow("Method",esc(s.method||"Cash"))}${rcRow("Ref. No.",esc(s.payRef||"-"))}<hr class="hr">
 <div class="ft">Thank you for your purchase!</div><div class="ft">Goods are not returnable without this receipt.</div><div class="ft">uzadigit.co.tz</div>
 <div class="cut">&#9986; - - - - - - - - - - - - - &#9986;</div></body>`;
 return html;
};
const RCT_PAGE="@page{margin:0}";
let rcCur=null;
function printReceipt(s){
 rcCur=s;const m=$("modal"),html=rcHtml(s);
 const doc=`<!doctype html><style>${RCT_CSS}html{background:#e9ecf3}body.rc{background:#fff;margin:14px auto;box-shadow:0 2px 10px rgba(0,0,0,.18)}@media print{html{background:#fff}body.rc{margin:0 auto;box-shadow:none}}${RCT_PAGE}</style>${html}`;
 m.innerHTML=`<div class="dialog"><div class="mh"><div><div class="ey">Receipt preview</div><h2>RCT-${esc(s.no)}</h2></div><button class="mx" data-mclose>×</button></div>
  <div class="mb" style="padding:0"><iframe id="rcFrame" style="width:100%;height:min(70vh,640px);border:0;display:block;background:#e9ecf3"></iframe></div>
  <div class="mf"><button class="btn ghost" style="color:#5d6b80;border-color:#aab" data-mclose>Close</button><button class="btn navy" id="rcPrint">${ic("print")}Print</button></div></div>`;
 $("rcFrame").srcdoc=doc;m.hidden=false;
 $("rcPrint").onclick=()=>{const w=$("rcFrame").contentWindow;
  try{w.focus();w.print()}catch(e){printDoc("Receipt "+rcCur.no,rcHtml(rcCur),RCT_CSS,RCT_PAGE)}};
}
function saleAct(v){
 const [a,arg]=v.split(":"),s=db.sales.find(x=>x.no===curSale);
 if(a==="custnew"){const r=$("ckNew");r.hidden=!r.hidden;if(!r.hidden)$("ckNewName").focus()}
 else if(a==="custadd"){const n=$("ckNewName").value.trim();if(!n)return;
  if(!db.customers.some(x=>x.name.toLowerCase()===n.toLowerCase()))db.customers.push({id:Date.now(),name:n,phone:$("ckNewPhone").value.trim()});
  save();$("custList").innerHTML=db.customers.map(x=>`<option value="${esc(x.name)}">`).join("");$("ckCust").value=n;$("ckNew").hidden=true;$("ckNewName").value=$("ckNewPhone").value="";toast("Customer added")}
 else if(a==="savesale")saveSale();
 else if(a==="printdn"){const d=db.deliveries.find(x=>x.no===arg),sl=db.sales.find(x=>x.no===d?.sale);if(d&&sl)printDoc(d.no,docHead("DELIVERY NOTE",d.no,sl)+`<table><tr><th>Item</th><th class="r">Qty</th></tr>${d.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${i.qty}</td></tr>`).join("")}</table><p>Received by: ____________</p>`)}
 else if(a==="printti"){const t=db.taxInv.find(x=>x.no===arg),sl=db.sales.find(x=>x.no===t?.sale);if(t&&sl)printDoc(t.no,docHead("TAX INVOICE",t.no,sl)+`<table><tr><th>Item</th><th class="r">Qty</th><th class="r">Total</th></tr>${sl.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${i.qty}</td><td class="r">${tz(itemTotal(i))}</td></tr>`).join("")}</table>${sl.vat?`<p class="r">VAT: ${tz(sl.vat)}</p>`:""}<h3>Amount due: ${tz(sl.status==="Pending"?sl.total:0)}</h3>`)}
 else if(!s)return;
 else if(a==="print")printReceipt(s);
 else if(a==="delivery"){if(!s.dn){const no="DN-"+pad(db.dnSeq++);db.deliveries.unshift({no,sale:s.no,customer:s.customer,branch:s.branch,date:today(),items:s.items.map(i=>({name:i.name,qty:i.qty}))});s.dn=no;save();toast(`Delivery note ${no} created`);openSale(s.no,"action")}else saleAct("printdn:"+s.dn)}
 else if(a==="taxinv"){const no="TINV-"+pad(db.tiSeq++);db.taxInv.unshift({no,sale:s.no,customer:s.customer,date:today(),amount:sTotal(s)});s.invoice=no;save();toast(`Tax invoice ${no} created`);openSale(s.no,"action")}
 else if(a==="return")openReturn(s);
 else if(a==="doreturn")doReturn(s);
 else if(a==="revoke"){if(!confirm(`Revoke ${s.no}? Stock will be restored and the sale removed from totals.`))return;
  keepOrig(s);s.items.forEach(i=>{const p=prodOf(i);if(p)p.stock+=i.qty-(i.ret||0)});s.total=0;s.cost=0;s.vat=0;s.status="Revoked";save();render();toast(`${s.no} revoked`);openSale(s.no,"action")}
}

/* Business sales */
const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toLocaleDateString("en-CA")};
const inPeriod=(s,p)=>{const t=today();return p==="all"||(p==="today"?s.date===t:p==="week"?s.date>=weekStart()&&s.date<=t:p==="month"?s.date.startsWith(t.slice(0,7)):s.date.startsWith(t.slice(0,4)))};
PAGES.bsales=()=>{
 const t=today(),ms=db.sales.filter(s=>s.date.startsWith(t.slice(0,7))),tot=sum(ms,"total"),cogs=sum(ms,"cost"),gp=tot-cogs;
 const exp=sum(db.expenses.filter(e=>e.date.startsWith(t.slice(0,7))),"amount"),op=gp-exp,pc=v=>(tot?v/tot*100:0),pf=v=>v.toFixed(v%1?2:0)+"%";
 const cr=ms.filter(s=>s.payment==="Credit"),ca=ms.filter(s=>s.payment!=="Credit");
 const cards=[["Total Sales",tz(tot),`${ms.length} sale(s)`,"cash","c-green"],["Credit Sales",tz(sum(cr,"total")),`${cr.length} sale(s)`,"card","c-orange"],["Cash Sales",tz(sum(ca,"total")),`${ca.length} sale(s)`,"dollar","c-green"],["COGS",tz(cogs),"Quantity sold x unit cost","box","c-orange"],
  ["Gross Profit",tz(gp),"Net sales minus COGS","trend","c-teal"],["Total Expenses",tz(exp),"Operating expenses","wallet","c-purple"],["Operating Profit",tz(op),"Gross profit minus expenses","pie","c-blue"],["Gross Margin",pf(pc(gp)),"Gross profit / net sales","percent","c-yellow"],["Operating Margin",pf(pc(op)),"Operating profit / net sales","pie","c-violet"]];
 const q=bs.q.toLowerCase();
 const rows=db.sales.filter(s=>(!q||s.no.toLowerCase().includes(q)||s.customer.toLowerCase().includes(q)||s.items.some(i=>i.name.toLowerCase().includes(q)||(i.sku||"").toLowerCase().includes(q)))&&(!bs.br||s.branch===bs.br)&&(!bs.cu||s.customer===bs.cu)&&(!bs.us||s.user===bs.us)&&(!bs.ty||s.type===bs.ty)&&inPeriod(s,bs.pe)&&(!bs.pa||payState(s)===bs.pa)&&(!bs.st||s.status===bs.st)&&(!bs.rc||s.converted));
 const so=(k,all,o)=>`<select class="sel" data-bsf="${k}"><option value="">${all}</option>${o.map(x=>`<option${bs[k]===x?" selected":""}>${esc(x)}</option>`).join("")}</select>`;
 const per=[["today","Today"],["week","This Week"],["month","This Month"],["year","This Year"],["all","All Time"]];
 const sumc=(l,v,ico)=>`<div class="sumc">${ic(ico)}<div><small>${l}</small><b>${v}</b></div></div>`,pt=p=>tz(sum(db.sales.filter(s=>inPeriod(s,p)),"total"));
 return `<div class="metrics" style="margin-bottom:20px">${cards.map(c=>`<div class="card m"><div class="lb">${c[0]}</div><div class="v">${c[1]}</div><div class="ds">${c[2]}</div><div class="mi-ic ${c[4]}">${ic(c[3])}</div></div>`).join("")}</div>
 <div class="card" style="padding:0"><div class="bfilters"><h2 style="align-self:end">Business Sales</h2>
  <label class="fl">Search Item / Sale<input data-bsf="q" value="${esc(bs.q)}" placeholder="Search by item, SKU, sale #, customer..." autocomplete="off"></label>
  <label class="fl">Branch${so("br","All Branches",db.branches)}</label><label class="fl">Customer${so("cu","All Customers",[...new Set(db.sales.map(s=>s.customer))])}</label>
  <label class="fl">User${so("us","All Users",db.users.map(u=>u.name))}</label><label class="fl">Sale Type${so("ty","All Sale Types",["Cash Sale","Credit Sale"])}</label>
  <label class="fl">Period<select class="sel" data-bsf="pe">${per.map(p=>`<option value="${p[0]}"${bs.pe===p[0]?" selected":""}>${p[1]}</option>`).join("")}</select></label><label class="fl">Payment${so("pa","All Payments",["Paid","Unpaid"])}</label>
  <label class="fl">Status${so("st","All Statuses",["Completed","Pending","Returned","Revoked"])}</label>
  <div style="grid-column:span 2"><label class="swl" style="font-size:14px"><input type="checkbox" data-bsf="rc"${bs.rc?" checked":""}> Recently converted only</label><small style="color:var(--muted);margin-left:22px">Sales from a Proforma/Sales Order, sorted by conversion time</small></div>
  <button class="btn navyo" data-act="bsreset" style="padding:10px">Reset Filters</button></div>
  <div style="padding:0 18px 18px"><div class="sumrow" style="margin-top:0">${sumc("Today",pt("today"),"cal")}${sumc("This Week",pt("week"),"cal")}${sumc("This Month",pt("month"),"cal")}${sumc("Filtered VAT",tz(rows.reduce((a,s)=>a+(s.vat||0),0)),"percent")}</div>
  <div class="tw"><table><thead><tr><th>#</th><th>Sale No.</th><th>Product</th><th>Date</th><th>Branch</th><th>Customer</th><th>User</th><th>Type</th><th>Method</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody>
  ${rows.map((s,k)=>`<tr><td>${k+1}</td><td><a class="lnk" data-sv="${esc(s.no)}">${esc(s.no)}</a></td><td>${s.items.map(i=>`<span class="pchip">${esc(i.name)}</span>`).join("")}</td><td>${fmtAt(s.at)}</td><td>${esc(s.branch)}</td><td>${s.customer==="Walk-in customer"?"-":esc(s.customer)}</td><td>${esc(s.user)}</td><td>${esc(s.type)}</td><td>${esc(s.method)}</td><td>${tz(sTotal(s))}</td><td>${tag(payState(s))}</td><td>${tag(s.status)}</td><td><button class="eyeb" data-sv="${esc(s.no)}" title="View sale">${ic("eye")}</button></td></tr>`).join("")||'<tr><td class="empty" colspan="13">No sales match these filters.</td></tr>'}</tbody></table></div></div></div>`;
};
ACT.bsreset=()=>{bs={q:"",br:"",cu:"",us:"",ty:"",pe:"month",pa:"",st:"",rc:false};render()};

/* Related lists */
PAGES.sreturns=()=>head("Sale returns","Items customers returned to the shop.")+table(["Return","Sale","Customer","Date","Items","Amount","Reason"],db.returns.map(r=>`<tr><td>${esc(r.no)}</td><td><a class="lnk" data-sv="${esc(r.sale)}">${esc(r.sale)}</a></td><td>${esc(r.customer)}</td><td>${fmtDate(r.date)}</td><td>${r.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(", ")}</td><td><b>${tz(r.amount)}</b></td><td>${esc(r.reason||"-")}</td></tr>`),"No sale returns yet.");
PAGES.delivery=()=>head("Delivery notes","Notes created from sales.")+table(["Note","Sale","Customer","Branch","Date","Items",""],db.deliveries.map(d=>`<tr><td>${esc(d.no)}</td><td><a class="lnk" data-sv="${esc(d.sale)}">${esc(d.sale)}</a></td><td>${esc(d.customer)}</td><td>${esc(d.branch)}</td><td>${fmtDate(d.date)}</td><td>${d.items.reduce((a,i)=>a+i.qty,0)}</td><td><button class="btn ghost sm" data-sa="printdn:${esc(d.no)}">Print</button></td></tr>`),"No delivery notes yet. Create one from a sale's Action tab.");
PAGES.saleinv=()=>head("Invoices","Tax invoices issued for credit sales.")+table(["Invoice","Sale","Customer","Date","Amount","Payment",""],db.taxInv.map(t=>{const s=db.sales.find(x=>x.no===t.sale);return `<tr><td>${esc(t.no)}</td><td><a class="lnk" data-sv="${esc(t.sale)}">${esc(t.sale)}</a></td><td>${esc(t.customer)}</td><td>${fmtDate(t.date)}</td><td>${tz(t.amount)}</td><td>${s?tag(payState(s)):"-"}</td><td><button class="btn ghost sm" data-sa="printti:${esc(t.no)}">Print</button></td></tr>`}),"No invoices yet. Create one from a credit sale's Action tab.");
PAGES.quotes=()=>head("Quotations","Price offers sent to customers.")+table(["Quotation","Customer","Date","Amount","Status"],[],"No quotations yet.");
PAGES.proforma=()=>head("Proforma invoices","Advance invoices before a sale is confirmed.")+table(["Proforma","Customer","Date","Amount","Status"],[],"No proforma invoices yet.");

/* Sales events */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-sv],[data-stab],[data-sa],[data-mclose],[data-cdel]");if(!t)return;const d=t.dataset;
 if(d.mclose!==undefined)$("modal").hidden=true;
 else if(d.sv)openSale(d.sv);
 else if(d.stab)openSale(curSale,d.stab);
 else if(d.cdel){cart.delete(+d.cdel);render()}
 else if(d.sa)saleAct(d.sa);
});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset||{};
 if(d.bsf){bs[d.bsf]=t.type==="checkbox"?t.checked:t.value;render()}
 else if(d.pf){if(d.pf==="cat"){posCat=t.value;posSub=""}else if(d.pf==="sub")posSub=t.value;else posStock=t.checked;render()}
 else if(d.cq){const p=db.products.find(x=>x.id===+d.cq);if(p){cart.set(p.id,Math.max(1,Math.min(Math.floor(+t.value)||1,p.stock)));render()}}
 else if(t.id==="ckType")$("ckPay").textContent=t.value==="Credit Sale"?"Unpaid":"Paid";
});
document.addEventListener("input",e=>{const t=e.target;
 if(t.dataset&&t.dataset.bsf==="q"){bs.q=t.value;const p=t.selectionStart;render();const x=document.querySelector('[data-bsf="q"]');x.focus();x.setSelectionRange(p,p)}
});

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
 const dd=e.target.closest("[data-dd]");
 document.querySelectorAll(".dd.open").forEach(x=>{if(!dd||x.id!==dd.dataset.dd)x.classList.remove("open")});
 if(dd){$(dd.dataset.dd).classList.toggle("open");return}
 if(e.target.closest("#burger")){window.innerWidth>800?document.body.classList.toggle("collapsed"):document.body.classList.toggle("open");return}
 if(e.target.id==="scrim"){document.body.classList.remove("open");return}
 const t=e.target.closest("[data-go],[data-grp],[data-act],[data-add],[data-inc],[data-dec],[data-pay],[data-payc],[data-restock],[data-edit],[data-branch],[data-mod],[data-ptab],[data-pg],[data-del],[data-setadd],[data-setdel],[data-dl],[data-pick],[data-upload],[data-clear],[data-xe],[data-xd],[data-xadd],[data-xdel]");if(!t)return;
 const d=t.dataset;
 if(d.go){go(d.go)}
 else if(d.grp!==undefined){const i=+d.grp;openGroups.has(i)?openGroups.delete(i):openGroups.add(i);t.parentElement.classList.toggle("open")}
 else if(d.act)ACT[d.act]();
 else if(d.xe)expenseForm(db.expenses.find(x=>x.id===+d.xe));
 else if(d.xd){const x=db.expenses.find(v=>v.id===+d.xd);if(x&&confirm("Delete this expense?")){db.expenses=db.expenses.filter(v=>v!==x);save();render();toast("Expense deleted")}}
 else if(d.xadd)xAdd(d.xadd);
 else if(d.xdel)xDel(d.xdel);
 else if(d.ptab){pTab=d.ptab;render()}
 else if(d.pg){pPage+=+d.pg;render()}
 else if(d.del){const p=db.products.find(x=>x.id===+d.del);if(p&&confirm(`Delete "${p.name}"?`)){db.products=db.products.filter(x=>x!==p);save();render();toast("Product deleted")}}
 else if(d.setadd)setAdd(d.setadd);
 else if(d.setdel)setDel(d.setdel);
 else if(t.hasAttribute("data-dl"))dlTemplate();
 else if(t.hasAttribute("data-pick"))$("upFile").click();
 else if(t.hasAttribute("data-upload"))importFile();
 else if(t.hasAttribute("data-clear")){pFile=null;upRes=null;render()}
 else if(d.add)addToCart(+d.add,1);
 else if(d.inc)addToCart(+d.inc,1);
 else if(d.dec)addToCart(+d.dec,-1);
 else if(d.pay){const s=db.sales.find(x=>x.no===d.pay);if(s){s.status="Completed";save();render()}}
 else if(d.payc){S().filter(s=>s.customer===d.payc&&s.status==="Pending").forEach(s=>s.status="Completed");save();render()}
 else if(d.edit)productForm(db.products.find(p=>p.id===+d.edit));
 else if(d.mod){const a=db.sub.addons,i=a.indexOf(d.mod);
  if(i>=0)a.splice(i,1);else{a.push(d.mod);db.sub.available=db.sub.available.filter(x=>x!==d.mod)}
  if(i>=0&&!db.sub.available.includes(d.mod)&&!SEEDMODS.includes(d.mod))db.sub.available.push(d.mod);save();render()}
 else if(d.branch){db.branch=d.branch;save();render()}
 else if(d.restock){const p=db.products.find(x=>x.id===+d.restock);
  openForm({title:"Add stock: "+p.name,submit:"Add",fields:[{name:"qty",label:"Quantity received",type:"number",min:1}],
   onSubmit:x=>{const q=Math.floor(+x.qty);if(!(q>0))throw new Error("Enter a quantity above 0.");p.stock+=q}})}
});
document.addEventListener("input",e=>{
 if(e.target.id==="xSearch"){xSearch=e.target.value;const pos=e.target.selectionStart;render();const x=$("xSearch");x.focus();x.setSelectionRange(pos,pos);return}
 if(e.target.id==="pSearch"){pSearch=e.target.value;pPage=1;const pos=e.target.selectionStart;render();const x=$("pSearch");x.focus();x.setSelectionRange(pos,pos);return}
 if(e.target.id==="search"){search=e.target.value;const pos=e.target.selectionStart;render();const s=$("search");s.focus();s.setSelectionRange(pos,pos)}
});
["dragover","dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest("#drop");if(!z)return;e.preventDefault();
 z.classList.toggle("over",ev==="dragover");if(ev==="drop")setFile(e.dataTransfer.files[0])}));
document.addEventListener("change",e=>{
 {const id=e.target.id,v=e.target.value;if(id==="xCat"){xCat=v;xType=""}else if(id==="xType")xType=v;else if(id==="xBranch")xBranch=v;else if(id==="xPay")xPay=v;else if(id==="xPeriod")xPeriod=v;if(/^x(Cat|Type|Branch|Pay|Period)$/.test(id))render()}
 if(e.target.id==="pCat"){pCat=e.target.value;pPage=1;render()}
 if(e.target.id==="pSize"){pSize=+e.target.value;pPage=1;render()}
 if(e.target.id==="upFile")setFile(e.target.files[0]);
 if(e.target.id==="repMonth"&&e.target.value){repMonth=e.target.value;render()}
 if(e.target.id==="trendBranch"){trendBranch=e.target.value;render()}
});
document.addEventListener("submit",e=>{
 if(e.target.id==="profileForm"){e.preventDefault();const f=new FormData(e.target);
  db.biz.name=f.get("name").trim()||db.biz.name;db.biz.location=f.get("location").trim()||db.biz.location;db.biz.tin=f.get("tin").trim();db.biz.email=f.get("email").trim();save();render();toast("Business profile saved")}
});
window.addEventListener("hashchange",route);
route();
</script>
